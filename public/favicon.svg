<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005f9e" />
      <stop offset="100%" stop-color="#003b66" />
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc107" />
      <stop offset="100%" stop-color="#ff9800" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Gauge Arc background -->
  <path d="M 126 316 A 150 150 0 1 1 386 316" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="24" stroke-linecap="round" />
  <!-- Score Gauge Arc active -->
  <path d="M 126 316 A 150 150 0 1 1 345 200" fill="none" stroke="url(#bolt)" stroke-width="24" stroke-linecap="round" filter="url(#shadow)" />

  <!-- Lightning Bolt -->
  <path d="M 276 120 L 190 260 L 250 260 L 220 380 L 320 230 L 260 230 Z" fill="url(#bolt)" filter="url(#shadow)"/>

  <!-- Accent Circle -->
  <circle cx="256" cy="380" r="10" fill="#ffffff"/>
</svg>